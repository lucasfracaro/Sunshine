---
# Builds the Sunshine AppImage with the DeckScreen patch (portal_virtual_display)
# and publishes it as a release of this fork. The DeckScreen installer downloads
# it on GNOME, where the Steam Deck becomes an extra monitor through it.
name: DeckScreen AppImage
permissions: {}

on:
  push:
    branches:
      - deckscreen/portal-virtual-display
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: echo "version=$(date -u +%Y.%-m%d.%-H%M%S)" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/ci-linux.yml
    with:
      release_commit: ${{ github.sha }}
      release_version: ${{ needs.version.outputs.version }}

  release:
    name: Release
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download AppImages
        uses: actions/download-artifact@v8
        with:
          pattern: build-Linux-AppImage-*
          merge-multiple: true
          path: dist

      - name: List
        run: ls -la dist

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: deckscreen-v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Sunshine ${{ needs.version.outputs.version }} (DeckScreen)
          make_latest: true
          files: dist/*.AppImage
          body: |
            Sunshine with the DeckScreen patch: `portal_virtual_display = enabled` makes
            `capture = portal` ask the compositor for a virtual monitor sized to the client
            (GNOME/Mutter). Used by https://github.com/lucasfracaro/deckscreen on GNOME.
